<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCG Pocket Battler</title>
<!-- A test page for the server, not the website. Open it in two tabs to play yourself. -->
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 760px; margin: 16px auto; padding: 0 16px; }
  section { border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  #options button { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 6px 8px; }
  #status { font-weight: 600; }
  .error { color: #b00020; }
</style>
</head>
<body>
<p id="status">Connecting…</p>
<section><h2>Opponent</h2><div id="opponent"></div></section>
<section><h2>You</h2><div id="you"></div></section>
<section><h2 id="prompt">Waiting</h2><div id="options"></div><p id="error" class="error"></p></section>

<script>
const $ = id => document.getElementById(id);
const socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/play");

const text = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const cards = list => list.map(c => text(c.name)).join(", ") || "—";
const pokemon = p => p
  ? `${text(p.name)} ${p.hp}/${p.maxHp} HP` +
    (Object.keys(p.energy).length ? ` · energy ${text(JSON.stringify(p.energy))}` : "") +
    (p.statuses.length ? ` · ${text(p.statuses.join(", "))}` : "") +
    (p.tool ? ` · tool ${text(p.tool.name)}` : "")
  : "—";

function renderSide(el, side, own) {
  el.innerHTML =
    `<b>${text(side.name)}</b> · ${side.points} points · deck ${side.deckSize} · energy ${text(side.energy ?? "—")} (next ${text(side.nextEnergy ?? "—")})<br>` +
    `Active: ${pokemon(side.active)}<br>` +
    `Bench: ${side.bench.map(pokemon).join(" | ") || "—"}<br>` +
    `Hand (${side.handSize}): ${own ? cards(side.hand) : "hidden"}<br>` +
    `Discard: ${cards(side.discard)}`;
}

function render(board) {
  renderSide($("opponent"), board.opponent, false);
  renderSide($("you"), board.you, true);
  $("status").textContent = `Turn ${board.turn} · ${board.yourTurn ? "your turn" : "opponent's turn"}` +
    (board.stadium ? ` · stadium ${board.stadium.name}` : "");
}

function clearOptions(prompt) {
  $("prompt").textContent = prompt;
  $("options").replaceChildren();
}

socket.onmessage = event => {
  const message = JSON.parse(event.data);
  switch (message.type) {
    case "waiting": $("status").textContent = "Waiting for an opponent. Open this page in another tab."; break;
    case "state": render(message.board); clearOptions("Waiting for opponent"); break;
    case "decision":
      clearOptions(message.prompt);
      $("error").textContent = "";
      message.options.forEach((label, index) => {
        const button = document.createElement("button");
        button.textContent = label;
        button.onclick = () => {
          clearOptions("Sent");
          socket.send(JSON.stringify({decision: message.id, option: index}));
        };
        $("options").append(button);
      });
      break;
    case "over": render(message.board); clearOptions(message.result); $("status").textContent = "Game over"; break;
    case "error": $("error").textContent = message.message; break;
  }
};
socket.onclose = () => { if ($("status").textContent !== "Game over") $("status").textContent = "Disconnected"; };
</script>
</body>
</html>
