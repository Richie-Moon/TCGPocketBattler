# Always Free Autonomous Database. The wallet and password live outside the repo:
#   DB_WALLET   folder the wallet zip was unzipped into
#   DB_SERVICE  tnsnames.ora alias; _tp is the one meant for OLTP apps
#   DB_PASSWORD password of DB_USER (defaults to ADMIN)
spring.autoconfigure.exclude=
# Values above can also come from .env at the working directory (gitignored).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:l7mrecyjpzxnmd8e_tp}?TNS_ADMIN=${DB_WALLET}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always

# Google sign-in; GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET come from .env too.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile
